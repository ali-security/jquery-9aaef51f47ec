name: seal-build

# Sealed rebuild of jquery@1.12.3 (npm). Build + pack only; tests run on Travis.
# The npm tarball for 1.12.x is published from the jquery-dist repo
# (see build/release/dist.js): jquery-dist master at release time (086d381c,
# "Release 2.2.2") overlaid with the freshly built dist files, src/,
# external/sizzle, LICENSE.txt, AUTHORS.txt, package.json and a generated
# bower.json, then `npm publish` from that directory.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write container build script
        run: |
          mkdir -p "$RUNNER_TEMP/seal"
          cat > "$RUNNER_TEMP/seal/build.sh" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          unset COMMIT

          fix_owner() {
            chown -R "${HOST_UID}:${HOST_GID}" /work
          }
          trap fix_owner EXIT

          node --version
          npm --version
          git --version

          # Registry time machine pinned to the 1.12.3 release date.
          npm config set registry "https://:2016-04-05T19%3A21%3A37.716Z@time-machines-npm.sealsecurity.io/"
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

          # Old git ignores safe.directory; harmless on newer git.
          git config --global --add safe.directory /work

          # Reproducibility: pin the @DATE stamp to the public release header.
          sed -i 's|( new Date() )\.toISOString()\.replace( /:.d+...d+Z\$/, "Z" )|"2016-04-05T19:16Z"|' build/tasks/build.js
          if grep -q 'new Date()' build/tasks/build.js; then
            echo "ERROR: @DATE expression in build/tasks/build.js was not pinned" >&2
            exit 1
          fi
          grep -n '"2016-04-05T19:16Z"' build/tasks/build.js

          # npm install (retried; network only).
          attempt=1
          until npm install; do
            if [ "$attempt" -ge 3 ]; then
              echo "ERROR: npm install failed after $attempt attempts" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "npm install failed, retrying (attempt $attempt/3)..." >&2
            sleep 15
          done

          # Upstream default grunt task: build + lint + uglify + dist + node smoke tests + compare_size.
          ./node_modules/.bin/grunt

          # The tracked dist/ is the 1.12.3 release build. Sealed security
          # patches change src/, so the rebuilt dist legitimately differs from
          # it; report the delta instead of requiring byte equality.
          git status --short -- dist/
          git --no-pager diff --stat -- dist/

          # Assemble the jquery-dist publish directory exactly as build/release/dist.js does.
          git clone https://github.com/jquery/jquery-dist.git /tmp/jqd
          cd /tmp/jqd
          git checkout 086d381c
          mkdir -p /tmp/jqd/dist
          for f in dist/jquery.js dist/jquery.min.js dist/jquery.min.map; do
            cp -f "/work/$f" /tmp/jqd/dist/
          done
          for f in src external/sizzle LICENSE.txt AUTHORS.txt package.json; do
            cp -rf "/work/$f" /tmp/jqd/
          done
          node -e '
            var fs = require("fs");
            var pkg = JSON.parse(fs.readFileSync("/tmp/jqd/package.json", "utf8"));
            fs.writeFileSync("/tmp/jqd/bower.json", JSON.stringify({
              name: pkg.name,
              main: pkg.main,
              license: "MIT",
              ignore: ["package.json"],
              keywords: pkg.keywords
            }, null, 2));
          '

          # jquery-dist's 086d381c carries a stray jQuery 3.0.0-beta1 slim build
          # (dist/jquery.slim.js, .min.js, .min.map) that the 1.12.3 release
          # published as-is and that grunt here never rebuilds. Port the sealed
          # CVE fixes into it, re-minify it with the release's uglify options and
          # check both files in jsdom (.github/seal-slim.js).
          /work/node_modules/.bin/grunt --gruntfile /work/.github/seal-slim.js \
            --base /work --dist=/tmp/jqd/dist
          # Guards: every sealed slim fix must be in jquery.slim.js and jquery.slim.min.js.
          slim_unfixed() {
            echo "ERROR: the $1 fix is missing from the slim build" >&2
            exit 1
          }
          # CVE-2020-11022: htmlPrefilter no longer rewrites "<tag/>" into "<tag></tag>"
          if grep -q 'rxhtmlTag' /tmp/jqd/dist/jquery.slim.js ||
            grep -qF '"<$1></$2>"' /tmp/jqd/dist/jquery.slim.min.js; then
            slim_unfixed CVE-2020-11022
          fi
          # CVE-2020-11023: <option>/<optgroup> get the <select> wrapper only where support.option is false
          if ! grep -qF 'support.option = !!div.lastChild;' /tmp/jqd/dist/jquery.slim.js ||
            grep -qF "option:[1,\"<select multiple='multiple'>\"" /tmp/jqd/dist/jquery.slim.min.js; then
            slim_unfixed CVE-2020-11023
          fi
          # CVE-2019-11358: deep jQuery.extend() skips "__proto__" keys
          if ! grep -qF 'name === "__proto__"' /tmp/jqd/dist/jquery.slim.js ||
            ! grep -qF '"__proto__"' /tmp/jqd/dist/jquery.slim.min.js; then
            slim_unfixed CVE-2019-11358
          fi
          # CVE-2016-10707: the boolean attrHandle wrapper swaps attrHandle[ lowercaseName ]
          # (uglify mangles the local name; the jsdom check covers jquery.slim.min.js)
          if ! grep -qF 'attrHandle[ lowercaseName ] = handle;' /tmp/jqd/dist/jquery.slim.js; then
            slim_unfixed CVE-2016-10707
          fi
          head -c 400 /tmp/jqd/dist/jquery.slim.min.js; echo
          tail -c 200 /tmp/jqd/dist/jquery.slim.min.js; echo
          ls -l /tmp/jqd/dist
          rm -rf /tmp/jqd/.git

          npm pack
          mkdir -p /work/seal-out
          cp -f /tmp/jqd/jquery-1.12.3.tgz /work/seal-out/
          ls -l /work/seal-out
          sha256sum /work/seal-out/jquery-1.12.3.tgz
          EOF
          bash -n "$RUNNER_TEMP/seal/build.sh"

      - name: Build and pack in node:5
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE":/work \
            -v "$RUNNER_TEMP/seal":/seal \
            -w /work \
            node:5 bash /seal/build.sh

      - name: Upload sealed tarball
        uses: actions/upload-artifact@v4
        with:
          name: jquery-1.12.3
          path: seal-out/jquery-1.12.3.tgz
          if-no-files-found: error
